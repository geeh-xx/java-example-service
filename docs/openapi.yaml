openapi: 3.0.3
info:
  title: example-service API
  version: 1.0.0
tags:
  - name: Users
    description: User endpoints
  - name: Metrics
    description: Operational and metrics endpoints
paths:
  /v1/users:
    post:
      tags:
        - Users
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /management/prometheus:
    get:
      tags:
        - Metrics
      summary: Prometheus scrape endpoint
      operationId: prometheus
      responses:
        '200':
          description: Prometheus format metrics
          content:
            text/plain:
              schema:
                type: string

  /management/health:
    get:
      tags:
        - Metrics
      summary: Application health status
      operationId: health
      responses:
        '200':
          description: health details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /management/env:
    get:
      tags:
        - Metrics
      summary: Safe environment properties
      operationId: env
      responses:
        '200':
          description: environment details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /management/metrics:
    get:
      tags:
        - Metrics
      summary: List available metrics
      operationId: metrics
      responses:
        '200':
          description: metrics overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /management/metrics/jvm.memory.used:
    get:
      tags:
        - Metrics
      summary: JVM used memory metric
      operationId: jvmMemoryUsed
      responses:
        '200':
          description: jvm memory used metric
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /management/metrics/process.uptime:
    get:
      tags:
        - Metrics
      summary: Process uptime metric
      operationId: processUptime
      responses:
        '200':
          description: process uptime metric
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /management/health/readiness:
    get:
      tags:
        - Metrics
      summary: Readiness probe
      operationId: readiness
      responses:
        '200':
          description: readiness status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /management/health/liveness:
    get:
      tags:
        - Metrics
      summary: Liveness probe
      operationId: liveness
      responses:
        '200':
          description: liveness status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Example User
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
    UserResponse:
      type: object
      required:
        - id
        - name
        - email
        - createdDate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        createdDate:
          type: string
          format: date-time
